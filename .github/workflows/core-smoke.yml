name: Core smoke
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os == 'Windows'
        with:
          ffmpeg-version: '8.1.2'
          architecture: x64
      - name: Install FFmpeg build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx264-dev nasm pkg-config zlib1g-dev
      - name: Install FFmpeg build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install x264 nasm pkg-config
      - uses: actions/cache@v5
        if: runner.os != 'Windows'
        with:
          path: .cache/ci-ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-ci-ffmpeg.sh') }}
      - name: Build pinned FFmpeg
        if: runner.os != 'Windows'
        run: bash scripts/setup-ci-ffmpeg.sh
      - run: bun install --frozen-lockfile
      - run: bun run setup
      - run: bun run build
      - run: bun run check
      - run: bun run test
      - run: bun scripts/core-smoke.ts
      - run: bun scripts/package-release.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-smoke-${{ matrix.os }}
          path: |
            artifacts/core-smoke/**/report.json
            artifacts/core-smoke/**/*.png
            artifacts/releases/*.tar.gz
            artifacts/releases/*.sha256
          if-no-files-found: warn
          retention-days: 14
